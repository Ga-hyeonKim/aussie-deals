name: Fetch Coles Specials

on:
  schedule:
    # Every Tuesday 21:30 UTC = Wednesday 05:30 AWST
    # 30 min after Woolworths to avoid Neon connection contention
    - cron: "30 21 * * 2"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # No `prisma db push` here. A scrape job must not migrate the schema:
      # on 2026-08-12 `--accept-data-loss` dropped the `embedding` column and
      # 98,595 vectors with it. Schema changes belong to deploy, not to a
      # weekly cron. If the database drifts from schema.prisma, the first
      # upsert fails and scrape-report exits non-zero — which is the signal
      # we actually wanted from this step.

      - run: npx playwright install chromium --with-deps

      - name: Run Coles specials fetcher
        run: npx tsx scripts/fetch-coles.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
