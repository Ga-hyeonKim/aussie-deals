name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Placeholders, not secrets. Nothing here connects to a database or to
    # Google — they exist because lib/prisma.ts and lib/auth.ts read these at
    # module load, which `next build` triggers while collecting page data.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # `next dev` always has a real URL, so it cannot catch the prerender
      # errors that useSearchParams and server/client boundary mistakes
      # produce. That is what this step is for.
      - run: npm run build
