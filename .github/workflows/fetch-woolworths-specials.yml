name: Fetch Woolworths Specials

on:
  schedule:
    # Every Wednesday at 21:00 UTC = Wednesday 05:00 AWST
    # Woolworths updates specials around 07:00 AEST (05:00 AWST)
    - cron: "0 21 * * 2"
    # Note: cron uses UTC; Tuesday 21:00 UTC = Wednesday 05:00 AWST
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Push schema to DB (with retry for Neon cold start)
        run: |
          # Exit non-zero if every attempt fails. The retry exists for Neon
          # cold starts, not to make a real schema mismatch survivable: the
          # old `&& break` left `sleep` as the last command, so three failed
          # pushes still exited 0 and the scraper ran against a schema the
          # database did not have. On 2026-08-12 that silently dropped a
          # week of price_history.
          for i in 1 2 3; do
            if npx prisma db push --accept-data-loss; then
              exit 0
            fi
            echo "Attempt $i failed, waiting 10s..."
            sleep 10
          done
          echo "::error::prisma db push failed 3 times - refusing to scrape against a mismatched schema"
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: npx playwright install chromium --with-deps

      - name: Run Woolworths fetcher
        run: npx tsx scripts/fetch-woolworths.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
